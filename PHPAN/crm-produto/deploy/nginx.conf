server {
    listen 80;
    server_name crm.exemplo.com;

    # APONTA PARA public/, não para a raiz do repositório.
    # Com a raiz exposta, qualquer um acessa /.env e /composer.json.
    root /var/www/crm-produto/current/public;
    index index.php;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Segunda barreira: dotfile nunca é servido (exceto .well-known do certbot).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
